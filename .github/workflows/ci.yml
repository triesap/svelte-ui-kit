name: ci

# Baseline verification workflow for the public svelte-ui-kit repository.
#
# This target contains no Rust workspace, so no Cargo job belongs here; the
# separately hosted Leptos reference guard is intentionally outside this public
# repository. The workflow performs no publication, deployment or release and
# reads no secrets or private tooling. Remote execution of this workflow is not
# claimed by the S010 commit; the same commands are run locally.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies (frozen, strict peers)
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict

      - name: Install bundled Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit
        run: pnpm run test:unit

      - name: Runner harness
        run: pnpm run test:harness

      - name: Integration
        run: pnpm run test:integration

      - name: Components
        run: pnpm run test:components

      - name: Registry
        run: pnpm run test:registry

      - name: Packed inventory
        run: pnpm run test:package

      - name: CLI smoke
        run: pnpm run test:cli-bootstrap

      - name: Consumer check
        run: pnpm run fixture:check

      - name: Consumer SSR
        run: pnpm run test:fixture

      - name: Browser
        run: pnpm run test:browser tests/browser/harness.spec.ts

      - name: Contract validation
        run: pnpm run check:contracts

      - name: Contract tests
        run: pnpm run test:contracts

  filesystem:
    # Configured lanes are not evidence of execution. Windows remains
    # unqualified: portable lexical paths do not prove Windows recovery.
    name: filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies (frozen, strict peers)
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: Build
        run: pnpm run build
      - name: Filesystem, process, durability and recovery controls
        run: >-
          node tools/run-unit-tests.mjs --suite integration
          tests/integration/platform-filesystem.test.ts
          tests/integration/transaction-processes.test.ts
          tests/integration/transaction-safety.test.ts
          tests/integration/filesystem-paths.test.ts
          tests/integration/durability-ordering.test.ts
          tests/integration/durability-flush-paths.test.ts
          tests/integration/recovery-prepublication.test.ts
          tests/integration/recovery-published.test.ts
          tests/integration/recovery-invalid.test.ts
          tests/integration/recovery-ownership.test.ts
          tests/integration/transaction-authority.test.ts
