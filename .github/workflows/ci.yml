# Complete local acceptance lanes in independent checked-out workspaces.
# Shared writers remain serial within each job; no artifacts cross jobs.
# Timeouts retain measured local headroom; hosted execution remains unqualified.
# Chromium and macOS/Linux are the approved scopes; no publication or secrets.
name: ci
on:
  pull_request: null
  push: null
permissions:
  contents: read
jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run format:check
        run: pnpm run format:check
      - name: pnpm run lint
        run: pnpm run lint
      - name: pnpm run typecheck
        run: pnpm run typecheck
      - name: pnpm run test:unit
        run: pnpm run test:unit
      - name: pnpm run test:harness
        run: pnpm run test:harness
      - name: pnpm run test:cli-bootstrap
        run: pnpm run test:cli-bootstrap
      - name: pnpm run check:ci
        run: pnpm run check:ci
      - name: pnpm run test:ci
        run: pnpm run test:ci
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run test:integration
        run: pnpm run test:integration
  components:
    name: components
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run build
        run: pnpm run build
      - name: pnpm run test:components
        run: pnpm run test:components
      - name: pnpm run test:registry
        run: pnpm run test:registry
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run test:package
        run: pnpm run test:package
  consumer:
    name: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run build
        run: pnpm run build
      - name: pnpm run fixture:check
        run: pnpm run fixture:check
      - name: pnpm run test:fixture
        run: pnpm run test:fixture
  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run build
        run: pnpm run build
      - name: pnpm exec playwright install --with-deps chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: pnpm run test:browser
        run: pnpm run test:browser
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run check:docs
        run: pnpm run check:docs
      - name: pnpm run test:docs
        run: pnpm run test:docs
  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: node --test --test-concurrency=1 tools/build-native-dependency.test.mjs tools/prepare-native-dependency.test.mjs
        run: node --test --test-concurrency=1 tools/build-native-dependency.test.mjs tools/prepare-native-dependency.test.mjs
  filesystem:
    name: filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out independent full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Prepare authenticated native dependency
        run: node tools/prepare-native-dependency.mjs --fixture
      - name: Install frozen strict dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies --engine-strict
      - name: pnpm run build
        run: pnpm run build
      - name: node tools/run-unit-tests.mjs --suite integration tests/integration/cleanup-restart-matrix.test.ts tests/integration/docs-recovery.test.ts tests/integration/durability-flush-paths.test.ts tests/integration/durability-ordering.test.ts tests/integration/filesystem-paths.test.ts tests/integration/lock-publication.test.ts tests/integration/platform-filesystem.test.ts tests/integration/publication-witness.test.ts tests/integration/recovery-invalid.test.ts tests/integration/recovery-ownership.test.ts tests/integration/recovery-prepublication.test.ts tests/integration/recovery-published.test.ts tests/integration/transaction-authority.test.ts tests/integration/transaction-cleanup.test.ts tests/integration/transaction-processes.test.ts tests/integration/transaction-safety.test.ts tests/integration/unchanged-state.test.ts
        run: node tools/run-unit-tests.mjs --suite integration tests/integration/cleanup-restart-matrix.test.ts tests/integration/docs-recovery.test.ts tests/integration/durability-flush-paths.test.ts tests/integration/durability-ordering.test.ts tests/integration/filesystem-paths.test.ts tests/integration/lock-publication.test.ts tests/integration/platform-filesystem.test.ts tests/integration/publication-witness.test.ts tests/integration/recovery-invalid.test.ts tests/integration/recovery-ownership.test.ts tests/integration/recovery-prepublication.test.ts tests/integration/recovery-published.test.ts tests/integration/transaction-authority.test.ts tests/integration/transaction-cleanup.test.ts tests/integration/transaction-processes.test.ts tests/integration/transaction-safety.test.ts tests/integration/unchanged-state.test.ts
